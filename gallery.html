<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYSUBWA | Gallery</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background-color: #f4f7fa;
        color: #1c2f4d;
    }

    header {
        background-color: #002d62;
        color: white;
        padding: 20px 40px;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
    }

    nav ul {
        list-style: none;
        display: flex;
        gap: 25px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    nav a:hover {
        color: #7fc8ff;
    }

    .hero {
        text-align: center;
        padding: 60px 20px;
        background: linear-gradient(to bottom, #d8ecff, #f4f7fa);
    }

    .hero h1 {
        font-size: 3rem;
        margin-bottom: 15px;
    }

    .hero p {
        font-size: 1.2rem;
    }

    .section {
        max-width: 1200px;
        margin: auto;
        padding: 60px 20px;
    }

    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
    }

    .gallery-item {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 10px rgba(0,0,0,.1);
        transition: transform 0.2s ease,
                    box-shadow 0.2s ease;
    }

    .gallery-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 20px rgba(0,0,0,.15);
    }

    .gallery-item img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
        cursor: pointer;
    }

    .gallery-caption {
        padding: 15px;
        text-align: center;
        font-weight: bold;
        color: #002d62;
    }

    footer {
        background-color: #002d62;
        color: white;
        text-align: center;
        padding: 30px;
        margin-top: 50px;
    }

    /* Lightbox */

    .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.9);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .lightbox img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 10px;
    }

    .lightbox.active {
        display: flex;
    }

    @media (max-width: 768px) {

        nav {
            flex-direction: column;
            gap: 20px;
        }

        nav ul {
            justify-content: center;
        }

        .hero h1 {
            font-size: 2.2rem;
        }

        .gallery-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<header>
    <nav>
        <h2>NYSUBWA</h2>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about-us.html">About Us</a></li>
            <li><a href="team-members.html">Team Members</a></li>
            <li><a href="calendar.html">Calendar</a></li>
            <li><a href="league-rules.html">League Rules</a></li>
        </ul>
    </nav>
</header>

<section class="hero">

    <h1>Gallery</h1>

    <p>
        Explore memorable moments from NYSUBWA competitions,
        training sessions, and special events. Also included: 
	olympic events, team pictures, and more..
    </p>

</section>

<section class="section">

    <div class="gallery-grid" id="galleryGrid"></div>

</section>

<div class="lightbox" id="lightbox">

    <img id="lightboxImage" src="" alt="Gallery Image">

</div>

<footer>

    <p>
        &copy; 2026 New York State Underwater Basket Weaving Association
    </p>

</footer>

<script src="gallery.js"></script>

<script>
const galleryGrid = document.getElementById("galleryGrid");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");

GALLERY_IMAGES.forEach(filename => {

    const item = document.createElement("div");
    item.className = "gallery-item";

    item.innerHTML = `
        <img src="${filename}" alt="${filename}">
        <div class="gallery-caption">
            ${filename
                .replace(/\.[^/.]+$/, "")
                .replace(/-/g, " ")}
        </div>
    `;

    const image = item.querySelector("img");

    image.addEventListener("click", () => {
        lightboxImage.src = image.src;
        lightbox.classList.add("active");
    });

    galleryGrid.appendChild(item);
});

lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
});
</script>

</body>
</html>
